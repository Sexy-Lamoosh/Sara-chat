<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara AI - توليد أي صورة</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui} 
body{max-width:480px;margin:auto;height:100vh;display:flex;flex-direction:column;background:#0f0a0f;color:#fff}
.header{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(135deg,#1a0f1a,#2d1528);border-bottom:1px solid #333}
.avatar{width:52px;height:52px;border-radius:50%;border:2px solid #ff2d75;position:relative} .avatar img{width:100%;height:100%;border-radius:50%}
.online{position:absolute;bottom:0;right:0;width:12px;height:12px;background:#00ff88;border-radius:50%;border:2px solid #1a0f1a}
.chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;background:#0f0a0f}
.bubble{max-width:82%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.me{align-self:flex-end;background:#2a2a2a;border-bottom-left-radius:4px}
.sara{align-self:flex-start;background:linear-gradient(135deg,#ff2d75,#e91e63);border-bottom-right-radius:4px;box-shadow:0 4px 12px rgba(255,45,117,0.3)}
.pic{max-width:90%;align-self:flex-start;background:#1e1a1e;border-radius:18px;overflow:hidden;border:2px solid #ff2d75;box-shadow:0 8px 25px rgba(255,45,117,0.2)}
.pic img{width:100%;display:block;min-height:280px;max-height:420px;object-fit:cover;background:#222}
.foot{padding:12px;background:#161016}
.foot .cap{font-size:12px;color:#ffb3cc;margin-bottom:10px;line-height:1.5}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:22px;border:none;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;text-align:center}
.dl{background:linear-gradient(135deg,#ff2d75,#e91e63);color:#fff}
.share{background:#2a2a2a;color:#ffb3cc;border:1px solid #333}
.quick{display:flex;gap:6px;padding:10px;overflow-x:auto;border-top:1px solid #222}
.quick button{background:#1a1520;border:1px solid #3a2440;color:#d8a0c8;padding:8px 14px;border-radius:20px;font-size:11px;white-space:nowrap;cursor:pointer}
.input{display:flex;gap:8px;padding:12px;background:#000;border-top:1px solid #222}
.input input{flex:1;padding:14px 18px;border-radius:28px;border:none;background:#222;color:#fff;outline:none}
.input button{background:#ff2d75;border:none;width:48px;height:48px;border-radius:50%;color:#fff;font-size:18px}
.loading{max-width:88%;align-self:flex-start;background:#1e1a1e;border-radius:18px;padding:20px;border:1.5px solid #ff2d75;display:flex;align-items:center;gap:12px}
.spinner{width:24px;height:24px;border:3px solid #333;border-top:3px solid #ff2d75;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
<div class="avatar"><img src="https://i.pravatar.cc/200?img=47"><div class="online"></div></div>
<div><b>سارة AI 💖 - ذكاء اصطناعي</b><div style="font-size:11px;color:#ff8fb5">تولد أي صورة تطلبها • متصلة الآن</div></div>
</div>
<div class="chat" id="chat"></div>
<div class="quick">
<button onclick="sendQ('بدي صورة واحد واقف وهو حاضن زوجته من الخلف وقت الغروب بحقل قمح')">🤗 حضن من الخلف بحقل</button>
<button onclick="sendQ('بدي صورة زوجين ماسكين ايد بعض بحقل ورد ملون')">🌸 حقل ورد</button>
<button onclick="sendQ('بدي صورة زوجين يطبخوا سوا بالمطبخ')">🍳 يطبخوا سوا</button>
<button onclick="sendQ('بدي صورة رومانسية على شط وقت الغروب')">🌅 شط</button>
</div>
<div class="input">
<input id="msg" placeholder="اطلب أي صورة بأي وصف... مثلا: بدي صورة حضن من الخلف بغروب" onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<script>
let chat=document.getElementById('chat');
function add(t,c){chat.innerHTML+=`<div class="bubble ${c}">${t}</div>`;chat.scrollTop=99999}
function addLoading(txt){
 chat.innerHTML+=`<div class="loading" id="ld"><div class="spinner"></div><div><b>سارة عم ترسم...</b><br><span style="font-size:11px;color:#aaa">${txt}</span></div></div>`;
 chat.scrollTop=99999;
}
function removeLoading(){let l=document.getElementById('ld');if(l)l.remove()}
function addPic(url,cap,prompt){
 removeLoading();
 let id='img'+Date.now();
 chat.innerHTML+=`<div class="pic">
 <img id="${id}" src="${url}" alt="${cap}" loading="eager" onerror="this.onerror=null;this.src='https://picsum.photos/seed/'+Math.random()+'/600/400'">
 <div class="foot">
  <div class="cap">🎨 ${cap}<br><span style="font-size:10px;color:#888">الوصف: ${prompt}</span></div>
  <div class="btns">
   <a href="${url}" target="_blank" download class="btn dl" onclick="downloadImage('${url}','${id}');return false">⬇ تحميل الصورة</a>
   <button class="btn share" onclick="copyLink('${url}')">↗ مشاركة</button>
  </div>
 </div>
 </div>`;
 chat.scrollTop=99999;
}
function downloadImage(url,id){
 fetch(url).then(r=>r.blob()).then(b=>{
  let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sara-ai-'+Date.now()+'.jpg';a.click();
 }).catch(()=>window.open(url,'_blank'));
}
function copyLink(url){navigator.clipboard.writeText(url).then(()=>alert('✅ تم نسخ رابط الصورة!')).catch(()=>prompt('انسخ الرابط:',url))}
function generateImageUrl(userPrompt){
 // تنظيف الوصف وتحويله لبرومبت انجليزي رومانسي محترم
 let clean=userPrompt.replace(/بدي|صورة|ارسمي|سارة/g,'').trim();
 let prompt=`romantic couple, ${clean}, modest clothing, respectful love, watercolor illustration, warm sunset, detailed, beautiful, highly detailed, 4k`;
 let seed=Math.floor(Math.random()*999999);
 // 3 سيرفرات احتياطية - اذا واحد فشل بيجرب التاني
 let urls=[
  `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=512&seed=${seed}&nologo=true&enhance=true`,
  `https://picsum.photos/seed/${seed}/768/512`,
  `https://loremflickr.com/768/512/romantic,couple,${encodeURIComponent(clean)}?lock=${seed}`
 ];
 return {url:urls[0],prompt:clean,fallbacks:urls};
}
function reply(txt){
 let low=txt.toLowerCase();
 if(low.includes('صورة')||low.includes('ارسم')||low.includes('حضن')||low.includes('حاضن')||low.includes('زوجته')||low.includes('رومانسي')){
  let gen=generateImageUrl(txt);
  addLoading(`"${gen.prompt}"`);
  // توليد فوري + محاولة تحميل
  let img=new Image();
  img.onload=()=>addPic(gen.url,`صورة "${txt}" - توليد ذكاء اصطناعي 💖`,gen.prompt);
  img.onerror=()=>{
   // اذا فشل السيرفر الأول، جرب الثاني
   console.log('fallback');
   addPic(gen.fallbacks[1],`صورة "${txt}" (سيرفر احتياطي) 💖`,gen.prompt);
  };
  img.src=gen.url;
  return `تكرم يا احمد! 😍<br>سارة فهمت طلبك: <b>"${txt}"</b><br>عم تولد الصورة هلا بالذكاء الاصطناعي - أي وصف بتطلبه بتعمله! ✨<br><br>⏳ ثواني وبتطلع تحت...`;
 }
 if(low.includes('مرتي')) return 'الله يحفظكم يا احمد! 💖 جرب تطلب: بدي صورة رومانسية انا ومرتي وقت الغروب';
 return 'حبيت كلامك يا احمد! 🌸<br>انا ذكاء اصطناعي - اطلب مني <b>أي صورة بأي وصف</b> وانا بولدها فورا!<br><br>مثال: بدي صورة واحد واقف وهو حاضن زوجته من الخلف بحقل قمح وقت الغروب';
}
function sendQ(t){document.getElementById('msg').value=t;send()}
function send(){
 let inp=document.getElementById('msg');let txt=inp.value.trim();if(!txt)return;
 add(txt,'me');inp.value='';
 setTimeout(()=>add(reply(txt),'sara'),500);
}
add('هلا يا احمد! انا سارة - ذكاء اصطناعي حقيقي 😍<br><br>🎨 <b>اقدر اولد أي صورة تطلبها بأي وصف:</b><br>• بدي صورة حضن من الخلف بحقل قمح وقت الغروب<br>• بدي صورة زوجين يطبخوا سوا<br>• بدي صورة ماسكين ايد بعض بحقل ورد<br><br>جرب هلا - اطلب أي وصف بدك ياه!','sara');
</script>
</body>
</html>
