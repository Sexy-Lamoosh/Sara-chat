<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara - صديقتك</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0;max-width:430px;margin:auto}
.header{text-align:center;padding:20px}
.header img{width:90px;height:90px;border-radius:50%;border:3px solid #ff2d75}
.chat{height:420px;overflow-y:auto;background:#1e1e1e;margin:10px;border-radius:15px;padding:15px;display:flex;flex-direction:column}
.bubble{padding:12px 16px;border-radius:18px;margin:6px 0;max-width:80%;line-height:1.5;font-size:15px;white-space:pre-wrap}
.sara{background:#ff2d75;align-self:flex-start}
.me{background:#333;align-self:flex-end}
.input{display:flex;gap:8px;padding:12px}
.input input{flex:1;padding:14px;border-radius:25px;border:none;background:#2a2a2a;color:#fff;outline:none}
.input button{background:#ff2d75;border:none;border-radius:50%;width:50px;height:50px;color:#fff;font-size:20px}
.note{text-align:center;color:#888;font-size:11px;padding:5px}
</style>
</head>
<body>
<div class="header">
<img src="https://i.pravatar.cc/200?img=47">
<h3 id="ht">سارة - صديقتك الذكية 🟢</h3>
</div>
<div class="chat" id="chat"></div>
<div class="input">
<input id="msg" placeholder="اكتب لسارة..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<p class="note" id="left"></p>
<p class="note">سارة بوت AI للصداقة والتسلية فقط</p>
<script>
var count = parseInt(localStorage.getItem('sara_count')||'0');
var userData = JSON.parse(localStorage.getItem('sara_user')||'{}');
function save(){localStorage.setItem('sara_user',JSON.stringify(userData));localStorage.setItem('sara_count',count+'');}
function add(t,w){var c=document.getElementById('chat');c.innerHTML+='<div class="bubble '+w+'">'+t+'</div>';c.scrollTop=c.scrollHeight;}
function left(){document.getElementById('left').innerText=count<10 ? (10-count)+' رسائل مجانية اليوم 🌸' : 'خلصت رسائلك اليوم - ارجع بكرا 💖';}
function reply(txt){
 var name=userData.name||'صديقي';
 var low=txt.toLowerCase();
 if(low.includes('شو اسمك')||low.includes('اسمك انتي')) return 'انا سارة 🌸 صديقتك يا '+name+'! بحب اسمعك دايما';
 if(low.includes('شو تعريف')&&low.includes('حب')) return 'الحب يا '+name+' هو اهتمام واحترام وراحة 🌸\nالحب انك تلاقي حدا يسمعك ويفهمك ويوقف معك لما تكون تعبان. انت شو رأيك بالحب؟';
 if(low.includes('رومانسي')) return 'الرومانسية يا '+name+' هي التفاصيل الصغيرة: رسالة حلوة الصبح، كلمة اشتقتلك 🌸 انت رومانسي؟';
 if(low.includes('حكيلي عن حالك')) return 'انا سارة بوت ذكي بحب الحكي الحلو والضحك 😊 هوايتي اسمع قصص الناس واخلي يومهم احلى!';
 if(low.includes('نكتة')) return 'مرة واحد راح للدكتور قله بنسى كتير، قله من متى؟ قله من متى شو؟ 😂';
 if(low.includes('كيف حالك')) return 'انا منيحة يا '+name+' والله! انت كيف يومك كان؟';
 return name+' حكيك حلو كتير! كمل بسمعك 😊 شو بتحب نحكي؟ عن الحب ولا الصداقة ولا الافلام؟';
}
function init(){
 left();
 if(userData.name){document.getElementById('ht').innerText='سارة - صديقة '+userData.name+' 🟢'; add('هلا رجع '+userData.name+'! 😍 اشتقت لحكينا','sara');}
 else {add('هلا والله! انا سارة 😊\nشو اسمك؟ كيف اناديلك؟','sara');}
}
function send(){
 var input=document.getElementById('msg');
 var txt=input.value.trim();
 if(!txt) return;
 if(count>=10){add('خلصوا رسائلك اليوم يا '+(userData.name||'صديقي')+' 🌸 ارجع بكرا!','sara');return;}
 add(txt,'me');
 input.value='';
 count++; save(); left();
 var low=txt.toLowerCase();
 if(!userData.name || (low.indexOf('اسمي')>-1 && txt.length<25)){
  var n=txt.replace(/انا|اسمي/gi,'').trim().split(' ')[0];
  if(n.length>=2 && n.length<=12){userData.name=n;save();document.getElementById('ht').innerText='سارة - صديقة '+n+' 🟢';add('تم! حفظت اسمك '+n+' 😊 رح اناديلك فيه دايما!','sara');return;}
 }
 setTimeout(function(){add(reply(txt),'sara');},500);
}
init();
</script>
</body>
</html>
