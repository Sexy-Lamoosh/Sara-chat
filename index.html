<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara - صور مضمونة</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;max-width:440px;margin:auto;display:flex;flex-direction:column;height:100vh}
.header{text-align:center;padding:12px;background:#160e15} .header img{width:75px;height:75px;border-radius:50%;border:3px solid #ff2d75}
.chat{flex:1;overflow-y:auto;background:#111;margin:8px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.bubble{padding:11px 14px;border-radius:18px;max-width:84%;line-height:1.6;font-size:14px;white-space:pre-wrap}
.sara{background:#ff2d75;align-self:flex-start} .me{background:#2c2c2c;align-self:flex-end}
.pic-wrap{max-width:88%;align-self:flex-start;background:#1e1e1e;border-radius:14px;overflow:hidden;border:1.5px solid #ff2d75}
.pic-wrap img{width:100%;display:block;min-height:250px;max-height:380px;object-fit:cover}
.pic-wrap .foot{padding:8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#ffb3cc}
.dlbtn{background:#ff2d75;color:#fff;border-radius:20px;padding:6px 14px;font-size:11px;text-decoration:none}
.quick{display:flex;gap:6px;padding:8px;overflow-x:auto} .quick button{background:#1e1e1e;border:1px solid #ff2d75;color:#ff8fb5;border-radius:20px;padding:7px 12px;font-size:11px;white-space:nowrap}
.input{display:flex;gap:8px;padding:10px;background:#000;border-top:1px solid #222}
.input input{flex:1;padding:13px;border-radius:25px;border:none;background:#222;color:#fff;outline:none}
.input button{background:#ff2d75;border:none;border-radius:50%;width:48px;height:48px;color:#fff}
</style>
</head>
<body>
<div class="header">
<img src="https://i.pravatar.cc/200?img=47">
<h3>سارة - 26 سنة 💖</h3>
</div>
<div class="chat" id="chat"></div>
<div class="quick">
<button onclick="sendQ('بدي صورة واحد حاضن زوجته من الخلف')">🤗 حضن من الخلف</button>
<button onclick="sendQ('بدي صورة حضن رومانسي')">💖 حضن</button>
<button onclick="sendQ('بدي صورة رومانسية بغروب الشمس')">🌅 غروب</button>
</div>
<div class="input">
<input id="msg" placeholder="اكتب: بدي صورة ..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<script>
let chat=document.getElementById('chat');
// صور مضمونة 100% من Unsplash - ما بتخلص وما فيها limit
const LIB={
 hug_back: [
  "https://images.unsplash.com/photo-1516589177381-225540d1a0b6?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=600&q=80&auto=format"
 ],
 hug_front: [
  "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=600&q=80&auto=format"
 ],
 romantic: [
  "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1500628550463-c8881a54d4?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1516589177381-225540d1a0b6?w=600&q=80&auto=format"
 ],
 flower: [
  "https://images.unsplash.com/photo-1490750967868-88aa4f44baee?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1516589177381-225540d1a0b6?w=600&q=80&auto=format"
 ],
 beach: [
  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80&auto=format",
  "https://images.unsplash.com/photo-1516589177381-225540d1a0b6?w=600&q=80&auto=format"
 ]
};
function add(t,w){chat.innerHTML+=`<div class="bubble ${w}">${t}</div>`;chat.scrollTop=chat.scrollHeight;}
function addPic(url,cap){
 let id="img"+Date.now();
 chat.innerHTML+=`<div class="pic-wrap"><img id="${id}" src="${url}" loading="eager" onerror="this.src='https://images.unsplash.com/photo-1516589177381-225540d1a0b6?w=600'"><div class="foot"><span>${cap}</span><a href="${url}" target="_blank" class="dlbtn">⬇ تحميل</a></div></div>`;
 chat.scrollTop=chat.scrollHeight;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function reply(txt){
 let low=txt.toLowerCase();
 let name="احمد";
 if(low.includes('صورة')||low.includes('حضن')||low.includes('رومانسي')){
  let url, cap;
  if(low.includes('من الخلف')||low.includes('ورا')||low.includes('خلف')){
   url=pick(LIB.hug_back); cap="حضن من الخلف كله حب وامان يا "+name+" 🤗";
  } else if(low.includes('ورد')||low.includes('حقل')||low.includes('زهر')){
   url=pick(LIB.flower); cap="حقل ورد رومانسي يا "+name+" 🌸";
  } else if(low.includes('شط')||low.includes('بحر')||low.includes('غروب')){
   url=pick(LIB.beach); cap="غروب رومانسي يا "+name+" 🌅";
  } else if(low.includes('حاضن')||low.includes('حضن')){
   url=pick(LIB.hug_front); cap="حضن دافئ كله حب يا "+name+" 💖";
  } else {
   url=pick(LIB.romantic); cap="صورة رومانسية محترمة يا "+name+" 💖";
  }
  // عرض فوري - بدون انتظار
  setTimeout(()=>addPic(url,cap),150);
  return `تكرم يا ${name}! 😍 هاي صورة "${txt}" بالضبط مثل ما طلبت - بتفتح فورا وفيها زر تحميل! 💖`;
 }
 if(low.includes('مرتي')||low.includes('نصيحة')) return "الله يحفظكم يا احمد! 💖 نصيحة: كل يوم احكي 'صباح الخير يا احلى شي بحياتي' 🌸";
 return "حبيت كلامك يا احمد! 🌸 اكتب: بدي صورة [اي وصف] وانا بجيبها فورا!";
}
function sendQ(t){document.getElementById('msg').value=t;send();}
function send(){
 let inp=document.getElementById('msg');let txt=inp.value.trim();if(!txt)return;
 add(txt,'me');inp.value='';
 setTimeout(()=>add(reply(txt),'sara'),400);
}
add('هلا يا احمد! انا سارة 26 سنة 😍<br>هلا الصور مضمونة 100% وبتفتح فورا بدون limit!<br>جرب: بدي صورة واحد حاضن زوجته من الخلف','sara');
</script>
</body>
</html>
