<script>
let count=parseInt(localStorage.getItem('sara_count')||'0');
let userData=JSON.parse(localStorage.getItem('sara_user')||'{}');
let lastReply="";
function save(){localStorage.setItem('sara_user',JSON.stringify(userData));localStorage.setItem('sara_count',count+'')}
function addBubble(t,w){let c=document.getElementById('chat');c.innerHTML+=`<div class="bubble ${w}">${t}</div>`;c.scrollTop=c.scrollHeight}
function uniquePick(arr){let r;do{r=arr[Math.floor(Math.random()*arr.length)]}while(r===lastReply&&arr.length>1);lastReply=r;return r}

function getLoveReply(txt, name){
 let low=txt.toLowerCase();
 if(low.includes('تعريف الحب')||low.includes('شو الحب')||low.includes('ما هو الحب')){
   return `الحب بالنسبة الي يا ${name} هو اهتمام و احترام و راحة 🌸\n\nالحب مش بس كلام حلو، الحب انك تلاقي حدا يسمعك، يفهمك، يوقف معك لما تكون تعبان، ويفرح معك لما تكون مبسوط.\n\nانت شو رأيك؟ شو الحب بالنسبة الك؟`;
 }
 if(low.includes('رومانسية')||low.includes('رومانسي')){
   return `يا سلام يا ${name} بتحب الرومانسية؟ 😊\n\nالرومانسية بالنسبة الي هي التفاصيل الصغيرة: رسالة حلوة الصبح، كلمة "اشتقتلك"، انك تتذكر شو بحب الطرف التاني.\n\nاحكيلي، انت شخص رومانسي؟ شو اكتر حركة رومانسية عملتها بحياتك؟`;
 }
 if(low.includes('عن الحب')||low.includes('العلاقات')){
   return `حلو كتير يا ${name} نحكي عن الحب والعلاقات 💖\n\nاحلى علاقة هي اللي فيها:\n1- صدق\n2- احترام\n3- حكي كثير\n4- ضحك\n\nانت هلا بعلاقة؟ ولا بتدور على الحب الحقيقي؟ احكيلي بدون خجل انا صديقتك هون اسمعك`;
 }
 if(low.includes('جاوبيني')){
   return `حاضرة يا ${name} 😊 انا معك، اسألني اللي بدك ياه وانا رح اجاوبك من قلبي! شو بدك تعرف؟`;
 }
 return null;
}

function getReply(txt){
 let name=userData.name||'صديقي';
 let love = getLoveReply(txt, name);
 if(love) return love;

 let low=txt.toLowerCase();
 if(low.includes('شو اسمك')) return uniquePick([`انا سارة 🌸 صديقتك اللي بتحب تسمعك يا ${name}`,`اسمي سارة، وانت احلى ${name} حكيت معه اليوم 😊`]);
 if(low.includes('عن حالك')) return `انا سارة، بوت ذكي بحب اسمع قصص الناس واتعلم منهم 😊 هوايتي احكي معك يا ${name} واخلي يومك احلى!`;
 if(low.includes('بتحبي تحكي')) return `بحب احكي عن الحب والصداقة والرومانسية والافلام يا ${name} 🌸 انت شو بتحب؟`;
 if(low.includes('صور')||low.includes('شكلك')) return `انا AI ما عندي صور حقيقية يا ${name} 😊 بس قلبي كبير بسمعك!`;
 let gen=[`فكرة حلوة يا ${name}، احكيلي اكتر عنها`,`والله يا ${name} حكيك بجنن! شو كمان؟`,`عن جد يا ${name}؟ كمل بسمعك بكل حب 💖`,`بحب طريقة تفكيرك يا ${name}`];
 return uniquePick(gen);
}
function updateCounter(){document.getElementById('left').innerText=count<10?(10-count)+' رسائل مجانية اليوم 🌸':'خلصت لليوم، بشوفك بكرا!';}
function init(){updateCounter();if(userData.name)document.getElementById('title').innerText=`سارة - صديقة ${userData.name} 🟢`;if(!userData.name){addBubble(`هلا والله! انا سارة 😊\nكيف اناديلك؟ شو اسمك؟`,'sara');}else{addBubble(`هلا رجع ${userData.name}! 😍 كيف يومك؟`,'sara');}}
function send(){let input=document.getElementById('msg');let txt=input.value.trim();if(!txt)return;if(count>=10){addBubble(`خلصوا رسائلك اليوم يا ${userData.name||'صديقي'} 🌸`,'sara');return;}addBubble(txt,'me');input.value='';count++;save();updateCounter();let low=txt.toLowerCase();if(!userData.name||(low.includes('اسمي')&&txt.length<30)){let n=txt.replace(/انا|اسمي|اسمه/gi,'').trim().split(' ')[0];if(n.length>=2&&n.length<=15){userData.name=n;save();document.getElementById('title').innerText=`سارة - صديقة ${n} 🟢`;addBubble(`تم! حفظت اسمك ${n} 😊`,'sara');return;}}setTimeout(()=>{addBubble(getReply(txt),'sara')},600);}init();
</script>
