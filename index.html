<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara - AI Friend</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;margin:0;max-width:420px;margin:auto}
.header{text-align:center;padding:20px}
.header img{width:90px;height:90px;border-radius:50%;border:3px solid #ff2d75}
.chat{height:450px;overflow-y:auto;background:#1a1a1a;margin:10px;border-radius:15px;padding:15px;display:flex;flex-direction:column}
.bubble{padding:12px 16px;border-radius:18px;margin:8px 0;max-width:78%;line-height:1.5}
.sara{background:#ff2d75;align-self:flex-start}
.me{background:#333;align-self:flex-end}
.input{display:flex;gap:10px;padding:10px}
.input input{flex:1;padding:14px;border-radius:25px;border:none;background:#2a2a2a;color:#fff;outline:none}
.input button{background:#ff2d75;border:none;border-radius:50%;width:52px;height:52px;color:#fff;font-size:20px;cursor:pointer}
.note{text-align:center;color:#777;font-size:11px;padding:8px}
</style>
</head>
<body>
<div class="header">
<img src="https://i.pravatar.cc/200?img=5">
<h3>سارة - صديقة AI 🟢 متصلة</h3>
<p style="font-size:12px;color:#aaa">هذا حساب افتراضي للتسلية - الردود من ذكاء اصطناعي</p>
</div>
<div class="chat" id="chat">
<div class="bubble sara">هلا! انا سارة، صديقتك الافتراضية. كيف بقدر اساعدك اليوم؟ 😊</div>
</div>
<div class="input">
<input id="msg" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<p class="note" id="left">10 رسائل مجانية متبقية</p>
<p class="note">شفافية: هذا بوت AI وليس شخص حقيقي</p>
<script>
let count=0;
let replies=["حلو كتير! احكيلي اكثر 😊","فهمت عليك، يومك كيف كان؟","فكرة حلوة! شو بتحب تعمل بوقت فراغك؟","هههه ضحكتني والله","عن جد؟ ما كنت بعرف! احكيلي زيادة","انا هون اسمعك، كمل...","شو اكثر اشي بتحبه بالأردن؟","كلامك لطيف، شكرا انك عم تحكي معي","لو بدك نحكي بموضوع ثاني خبرني","انا بتعلم منك كل يوم!"];
function send(){
let input=document.getElementById('msg');
let txt=input.value.trim();
if(!txt) return;
let chat=document.getElementById('chat');
chat.innerHTML+=`<div class="bubble me">${txt}</div>`;
count++;
document.getElementById('left').innerText=(10-count>0? (10-count)+' رسائل متبقية' : 'انتهت الرسائل المجانية');
input.value='';
chat.scrollTop=chat.scrollHeight;
if(count>=10){
setTimeout(()=>{chat.innerHTML+=`<div class="bubble sara">خلصت رسائلك المجانية اليوم. اذا حبيت تكمل، فيك ترجع بكرا مجانا! 🌸</div>`;chat.scrollTop=chat.scrollHeight;},600);
return;
}
let r=replies[Math.floor(Math.random()*replies.length)];
setTimeout(()=>{chat.innerHTML+=`<div class="bubble sara">${r}</div>`;chat.scrollTop=chat.scrollHeight;},700);
}
</script>
</body>
</html>
