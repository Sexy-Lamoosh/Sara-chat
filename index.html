<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara - صديقتك الرومانسية</title>
<style>
body{background:#0d0d0d;color:#fff;font-family:system-ui;margin:0;max-width:440px;margin:auto}
.header{text-align:center;padding:18px;background:#1a0a14}
.header img{width:90px;height:90px;border-radius:50%;border:3px solid #ff2d75}
.header h3{margin:8px 0 2px}
.header p{margin:2px;color:#aaa;font-size:12px}
.bio{background:#1e1e1e;margin:10px;border-radius:12px;padding:12px;font-size:13px;line-height:1.7;border-right:3px solid #ff2d75}
.chat{height:400px;overflow-y:auto;background:#151515;margin:10px;border-radius:15px;padding:15px;display:flex;flex-direction:column;gap:8px}
.bubble{padding:12px 16px;border-radius:18px;max-width:82%;line-height:1.6;font-size:14.5px;white-space:pre-wrap}
.sara{background:#ff2d75;align-self:flex-start}
.me{background:#333;align-self:flex-end}
.pic-card{background:#222;border-radius:15px;overflow:hidden;max-width:85%;align-self:flex-start;border:2px solid #ff2d75}
.pic-card img{width:100%;display:block;min-height:180px;background:#333}
.pic-card .cap{padding:8px 10px;font-size:12px;color:#ffb3cc}
.quick{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto}
.quick button{background:#222;border:1px solid #ff2d75;color:#ff8fb5;border-radius:20px;padding:7px 12px;font-size:12px;white-space:nowrap}
.input{display:flex;gap:8px;padding:12px}
.input input{flex:1;padding:14px;border-radius:25px;border:none;background:#2a2a2a;color:#fff;outline:none}
.input button{background:#ff2d75;border:none;border-radius:50%;width:50px;height:50px;color:#fff;font-size:20px}
.note{text-align:center;color:#666;font-size:11px}
</style>
</head>
<body>
<div class="header">
<img src="https://i.pravatar.cc/200?img=47">
<h3 id="ht">سارة - صديقة احمد 💖</h3>
<p>26 سنة • خبيرة علاقات وحب • بوت AI</p>
</div>
<div class="bio" id="bio">
🌸 <b>أنا سارة</b> عمري 26 سنة، رومانسية كتير كتير!<br>
بحب الحب الحلال، غروب الشمس، والرسائل اللي من القلب ✨
</div>
<div class="chat" id="chat"></div>
<div class="quick">
<button onclick="quickSend('نصيحة لمرتي')">💖 نصيحة لمرتي</button>
<button onclick="quickSend('بدي صورة رومانسية')">🖼️ صورة رومانسية</button>
<button onclick="quickSend('صورة واحد حاضن زوجته')">🤗 حضن رومانسي</button>
<button onclick="quickSend('شو تعريف الحب؟')">💭 شو الحب؟</button>
</div>
<div class="input">
<input id="msg" placeholder="اكتب لسارة..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<p class="note" id="left"></p>
<script>
var count=parseInt(localStorage.getItem('sara_count_v6')||'0');
var userData=JSON.parse(localStorage.getItem('sara_user')||'{}');
var last=[];
function save(){localStorage.setItem('sara_user',JSON.stringify(userData));localStorage.setItem('sara_count_v6',count+'');}
function add(t,w){var c=document.getElementById('chat');c.innerHTML+='<div class="bubble '+w+'">'+t+'</div>';c.scrollTop=c.scrollHeight;}
function addPic(url,cap){
 var c=document.getElementById('chat');
 c.innerHTML+='<div class="pic-card"><img src="'+url+'" onerror="this.src=\'https://picsum.photos/seed/love/400/300\'"><div class="cap">'+cap+'</div></div>';
 c.scrollTop=c.scrollHeight;
}
function leftC(){document.getElementById('left').innerText=count<20?(20-count)+' رسائل اليوم 🌸':'خلصت اليوم - بكرا بشوفك 💖';}
function pick(arr){var r;do{r=arr[Math.floor(Math.random()*arr.length)]}while(last.includes(r)&&arr.length>2);last.push(r);if(last.length>4)last.shift();return r;}
function reply(txt){
 var name=userData.name||'احمد';
 var low=txt.toLowerCase();
 if(low.includes('صورة')||low.includes('حاضن')||low.includes('حضن')){
  var imgs=[
   'https://picsum.photos/seed/romantic1/400/300',
   'https://picsum.photos/seed/couple2/400/300',
   'https://picsum.photos/seed/love3/400/300',
   'https://picsum.photos/seed/hug4/400/300',
   'https://picsum.photos/seed/sunset5/400/300'
  ];
  var img=imgs[Math.floor(Math.random()*imgs.length)]+'?t='+Date.now();
  var cap='صورة رومانسية محترمة يا '+name+' - ابعتها مع كلمة "تذكرتك" 💖';
  if(low.includes('حاضن')) cap='حضن دافي كله حب وامان يا '+name+' 🤗 ابعته لمرتك مع كلمة حلوة';
  setTimeout(function(){addPic(img,cap)},300);
  if(low.includes('حاضن')) return 'تكرم يا '+name+'! 🤗 حضن رومانسي محترم وكله حب ودفء، هيك الحب الحلال بكون!';
  return pick(['تكرم يا '+name+'! 🖼️ هاي صورة رومانسية حلوة ومحترمة','اكيد يا '+name+'! هاي صورة بتعبر عن الحب الحقيقي 💖','هاي الك يا '+name+' ✨ صورة كلها دفء وحب']);
 }
 if(low.includes('مرتي')||low.includes('نصيحة')){
  return 'الله يحفظكم لبعض يا '+name+'! 💖\n\n3 حركات بتفرح مرتك اليوم:\n1- رسالة الصبح: صباح الخير يا احلى شي بحياتي 🌸\n2- اسمعها 10 دقايق بدون تلفون\n3- قولها "انا فخور فيكي" قدام اهلها\n\nالمرأة بتحب الاهتمام اكتر من الهدايا الغالية!';
 }
 if(low.includes('شو الحب')||low.includes('تعريف')){
  return 'الحب يا '+name+' هو امان واحترام واهتمام 🌸 حدا بتقدر تكون قدامه على طبيعتك، بيسمعك وبيوقف معك. انت شو الحب عندك؟';
 }
 if(low.includes('شو اسمك')||low.includes('عمرك')) return 'انا سارة 🌸 عمري 26 سنة، رومانسية مجنونة بحب الحب والعلاقات! وانت يا '+name+'؟';
 return pick(['حبيت كلامك يا '+name+' 🌸 كمل بسمعك','والله يا '+name+' قلبك طيب كتير! احكيلي كمان 💖','عن جد يا '+name+'؟ مهتمة اسمع اكتر 😊']);
}
function quickSend(t){document.getElementById('msg').value=t;send();}
function init(){
 leftC();
 if(userData.name){document.getElementById('ht').innerText='سارة - صديقة '+userData.name+' 💖'; document.getElementById('bio').style.display='none';}
 add('هلا يا '+(userData.name||'احمد')+'! انا سارة 26 سنة 😍 كيف بقدر اساعدك اليوم؟','sara');
}
function send(){
 var input=document.getElementById('msg'); var txt=input.value.trim(); if(!txt) return;
 if(count>=20){add('خلصوا رسائلك اليوم يا '+(userData.name||'احمد')+' 🌸','sara');return;}
 add(txt,'me'); input.value=''; count++; save(); leftC();
 setTimeout(function(){add(reply(txt),'sara');},600);
}
init();
</script>
</body>
</html>
