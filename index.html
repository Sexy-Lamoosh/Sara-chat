<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sara 10 - صور فورية</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;max-width:440px;margin:auto;display:flex;flex-direction:column;height:100vh}
.header{text-align:center;padding:12px;background:#160e15} .header img{width:75px;height:75px;border-radius:50%;border:3px solid #ff2d75}
.chat{flex:1;overflow-y:auto;background:#111;margin:8px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.bubble{padding:11px 14px;border-radius:18px;max-width:84%;line-height:1.6;font-size:14px;white-space:pre-wrap}
.sara{background:#ff2d75;align-self:flex-start} .me{background:#2c2c2c;align-self:flex-end}
.pic-wrap{max-width:88%;align-self:flex-start;background:#1e1e1e;border-radius:14px;overflow:hidden;border:1.5px solid #ff2d75}
.pic-wrap img{width:100%;display:block;min-height:250px;object-fit:cover}
.pic-wrap .foot{padding:8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#ffb3cc}
.dlbtn{background:#ff2d75;color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:11px;text-decoration:none}
.quick{display:flex;gap:6px;padding:8px;overflow-x:auto} .quick button{background:#1e1e1e;border:1px solid #ff2d75;color:#ff8fb5;border-radius:20px;padding:7px 12px;font-size:11px;white-space:nowrap}
.input{display:flex;gap:8px;padding:10px;background:#000;border-top:1px solid #222}
.input input{flex:1;padding:13px;border-radius:25px;border:none;background:#222;color:#fff;outline:none}
.input button{background:#ff2d75;border:none;border-radius:50%;width:48px;height:48px;color:#fff}
</style>
</head>
<body>
<div class="header">
<img src="https://i.pravatar.cc/200?img=47">
<h3>سارة - 26 سنة 💖 صور فورية</h3>
</div>
<div class="chat" id="chat"></div>
<div class="quick">
<button onclick="sendQ('بدي صورة واحد حاضن زوجته من الخلف')">🤗 حضن من الخلف</button>
<button onclick="sendQ('بدي صورة حضن رومانسي')">💖 حضن رومانسي</button>
<button onclick="sendQ('نصيحة لمرتي')">💡 نصيحة</button>
</div>
<div class="input">
<input id="msg" placeholder="اكتب: بدي صورة ..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<script>
let chat=document.getElementById('chat');
function add(t,w){chat.innerHTML+=`<div class="bubble ${w}">${t}</div>`;chat.scrollTop=chat.scrollHeight;}
function addPicInstant(url,cap){
 // هون الصورة بتطلع فورا - ما منستنى تحميل
 chat.innerHTML+=`<div class="pic-wrap"><img src="${url}" alt="romantic" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1516589177381-225540d1a0b6?w=600'"><div class="foot"><span>${cap}</span><a href="${url}" target="_blank" class="dlbtn">⬇ تحميل</a></div></div>`;
 chat.scrollTop=chat.scrollHeight;
}
function reply(txt){
 let low=txt.toLowerCase();
 if(low.includes('صورة')||low.includes('حضن')||low.includes('رومانسي')){
  // توليد فوري بدون انتظار
  let prompt="romantic couple modest clothing, respectful love, watercolor, sunset, "+txt.replace(/بدي|صورة|ارسمي/g,'');
  let seed=Math.floor(Math.random()*100000);
  let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${seed}&nologo=1`;
  setTimeout(()=>addPicInstant(url, txt+" 💖"), 200);
  return `تكرم يا احمد! 😍 عم ارسملك: "${txt}"<br>الصورة رح تطلع تحت هلا فورا! ✨`;
 }
 if(low.includes('مرتي')) return "الله يحفظكم يا احمد! 💖 جرب: صباح الخير يا احلى شي بحياتي 🌸";
 return "حبيت كلامك يا احمد! 🌸 اكتب: بدي صورة حضن رومانسي";
}
function sendQ(t){document.getElementById('msg').value=t;send();}
function send(){
 let inp=document.getElementById('msg');let txt=inp.value.trim();if(!txt)return;
 add(txt,'me');inp.value='';
 setTimeout(()=>add(reply(txt),'sara'),300);
}
add('هلا يا احمد! انا سارة 26 سنة 😍<br>هلا الصور بتطلع فورا!<br>جرب: بدي صورة واحد حاضن زوجته من الخلف','sara');
</script>
</body>
</html>
